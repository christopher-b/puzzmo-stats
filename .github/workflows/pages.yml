name: Deploy static content to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      # npm 11.6.2+ has a known `npm ci` regression with optional architecture
      # packages in existing lockfiles. Pin until GitHub's bundled npm includes
      # npm/cli#8981 or later.
      - run: npm install -g npm@11.6.1
      - run: npm ci
      - run: npm run check
      - run: mkdir -p pages/demo pages/dist
      - run: cp demo/index.html pages/demo/index.html
      - run: cp dist/puzzmo-stats.dev.js dist/puzzmo-stats.dev.js.map pages/dist/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: demo
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
