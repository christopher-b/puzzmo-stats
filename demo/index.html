<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzmo Stats Demo</title>
    <link rel="preconnect" href="https://rsms.me/">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">

    <style>
      :root {
        font-family: Charter, "Bitstream Charter", "Sitka Text", Cambria, serif;
        font-feature-settings:
          "liga" 1,
          "calt" 1;
        font-size: 1.25rem;
      }

      .puzzmo-container {
        max-width: 45ch;
        border: thin solid #333;
        border-radius: 10px;
        padding: 1rem;
      }

      puzzmo-stats {
        --puzzmo-stats-font-display: InterVariable, Inter, sans-serif;
      }
    </style>
  </head>
  <body>
    <h1>Puzzmo Stats Demo</h1>
    <p>
      This is a demo of the `puzzmo-stats` web component. It loads Puzzmo streak
      stats from ATProto records.
    </p>
    <p>
      For this to work, you must have your Puzzmo account connected to your
      ATProto (Bluesky) account.
    </p>

    <div class="puzzmo-container">
      <puzzmo-stats handle="cbennell.com"></puzzmo-stats>
    </div>

    <script type="module">
      new EventSource("/esbuild").addEventListener("change", () =>
        location.reload(),
      );
    </script>
    <script type="module" src="../dist/puzzmo-stats.dev.js"></script>
  </body>
</html>
